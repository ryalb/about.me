# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# Built-in hygiene hooks
[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
]

# Local tools — ruff (lint + format) + ty (type check)
[[repos]]
repo = "local"
hooks = [
    { id = "ruff-check", name = "ruff check", entry = "ruff check --fix --output-format=concise", language = "system", types_or = ["python", "pyi"] },
    { id = "ruff-format", name = "ruff format", entry = "ruff format", language = "system", types_or = ["python", "pyi"] },
    { id = "ty", name = "ty type check", entry = "ty check --output-format=concise", language = "system", types = ["python"], pass_filenames = false },
]
