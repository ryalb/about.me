[project]
name = "resume-generator"
version = "0.1.0"
description = "Generate multiple resume versions from a master JSON Resume file"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "pydantic>=2",
    "jinja2>=3",
    "python-docx>=1",
    "markdown-it-py>=3",
    "weasyprint>=60",
]

[project.scripts]
resume = "resume_generator.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resume_generator"]


